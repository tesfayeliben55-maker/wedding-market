<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#1e40af">
<title>WEDDING Market</title>
<style>
:root {
    --bg-primary: #0a0a0a; --bg-secondary: #1a1a1a; --bg-tertiary: #27272a;
    --text-primary: #ffffff; --text-secondary: #a1a1aa; --text-muted: #71717a;
    --border-color: #27272a; --border-input: #3f3f46;
    --accent: #3b82f6; --accent-dark: #1e40af; --accent-light: #60a5fa;
    --card-bg: #1a1a1a; --input-bg: #0a0a0a;
}
body.light-theme {
    --bg-primary: #f5f5f7; --bg-secondary: #ffffff; --bg-tertiary: #e5e5e7;
    --text-primary: #1a1a1a; --text-secondary: #52525b; --text-muted: #71717a;
    --border-color: #d4d4d8; --border-input: #a1a1aa;
    --accent: #2563eb; --accent-dark: #1e40af; --accent-light: #3b82f6;
    --card-bg: #ffffff; --input-bg: #ffffff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:var(--bg-primary); color:var(--text-primary); padding-bottom:75px; transition:background .3s, color .3s; }
.header { background:linear-gradient(135deg,#1e3a8a,#1e40af); padding:22px 20px; text-align:center; border-bottom:3px solid #3b82f6; position:relative; }
.logo { font-size:28px; font-weight:bold; color:white; }
.tagline { font-size:12px; opacity:.9; margin-top:5px; color:white; }
.header-icons { position:absolute; top:20px; right:20px; display:flex; gap:12px; }
.header-icon { font-size:22px; cursor:pointer; color:white; }
.lang-switch { display:flex; justify-content:center; gap:10px; padding:10px; background:var(--bg-secondary); }
.lang-btn { padding:7px 22px; border:2px solid var(--accent); border-radius:20px; cursor:pointer; font-weight:bold; background:var(--bg-primary); color:var(--accent); font-size:13px; }
.lang-btn.active { background:var(--accent-dark); color:white; }
.tabs { display:flex; background:var(--bg-secondary); padding:8px; gap:4px; overflow-x:auto; border-bottom:2px solid var(--accent-dark); }
.tab { flex:1; text-align:center; padding:9px 6px; border-radius:20px; cursor:pointer; font-weight:bold; font-size:11px; color:var(--text-secondary); white-space:nowrap; }
.tab.active { background:var(--accent-dark); color:white; }
.section-title { font-size:17px; font-weight:bold; margin:15px; color:var(--accent); display:flex; justify-content:space-between; align-items:center; }
.back-btn { background:var(--bg-tertiary); color:var(--text-secondary); border:none; padding:6px 14px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; }
.search-box { padding:15px; background:var(--bg-secondary); margin:12px 15px; border-radius:50px; border:1px solid var(--border-color); }
.search-input { width:100%; padding:12px 18px; border:1px solid var(--border-input); border-radius:50px; font-size:15px; background:var(--input-bg); color:var(--text-primary); }
.search-input:focus { outline:none; border-color:var(--accent); }
.categories-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 15px; margin-bottom:20px; }
.category-card { background:var(--bg-secondary); border-radius:15px; padding:12px 5px; text-align:center; cursor:pointer; border:2px solid transparent; transition:all .3s; }
.category-card.active { border-color:var(--accent); background:rgba(59,130,246,.15); }
.category-card:active { transform:scale(.95); }
.category-icon { font-size:30px; margin-bottom:6px; display:block; }
.category-name { font-size:10px; font-weight:600; color:var(--text-secondary); }
.card { background:var(--bg-secondary); border-radius:15px; padding:18px; margin:0 15px 12px; border:1px solid var(--border-color); }
.btn { padding:12px 16px; border:none; border-radius:25px; font-weight:bold; cursor:pointer; font-size:14px; }
.btn-primary { background:linear-gradient(135deg,var(--accent-dark),var(--accent)); color:white; }
.btn-success { background:linear-gradient(135deg,#10b981,#059669); color:white; }
.btn-warning { background:linear-gradient(135deg,#f59e0b,#d97706); color:white; }
.btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
.btn-dark { background:var(--bg-tertiary); color:var(--text-secondary); border:1px solid var(--border-input); }
.btn-full { width:100%; }
.btn-sm { padding:8px 12px; font-size:12px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.service-card { background:var(--bg-secondary); border-radius:18px; padding:18px; margin:0 15px 12px; border:1px solid var(--border-color); border-left:4px solid var(--accent); position:relative; }
.service-header { display:flex; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
.service-name { font-size:17px; font-weight:bold; color:var(--accent); }
.service-price { background:linear-gradient(135deg,var(--accent-dark),var(--accent)); color:white; padding:4px 12px; border-radius:15px; font-size:13px; }
.service-rating { margin:8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.stars { color:#ffc107; font-size:16px; }
.rating-text { font-size:12px; color:var(--text-muted); }
.service-details { color:var(--text-secondary); font-size:13px; margin:8px 0; display:flex; gap:12px; flex-wrap:wrap; }
.service-description { color:var(--text-primary); font-size:13px; margin:8px 0; line-height:1.6; opacity:.9; }
.btn-group { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.btn-group button { flex:1; padding:10px 6px; border:none; border-radius:25px; font-weight:bold; cursor:pointer; font-size:12px; min-width:55px; }
.form-card { background:var(--bg-secondary); border-radius:20px; padding:20px; margin:15px; border:1px solid var(--accent-dark); }
.form-group { margin-bottom:15px; }
.form-group label { display:block; margin-bottom:8px; font-weight:bold; color:var(--accent); font-size:14px; }
.form-group input,.form-group select,.form-group textarea { width:100%; padding:12px; border:1px solid var(--border-input); border-radius:10px; font-size:15px; background:var(--input-bg); color:var(--text-primary); }
.form-group input:focus,.form-group select:focus,.form-group textarea:focus { outline:none; border-color:var(--accent); }
.form-group textarea { resize:vertical; min-height:80px; }
.form-group small { color:var(--text-muted); font-size:11px; display:block; margin-top:5px; }
.submit-btn { background:linear-gradient(135deg,var(--accent-dark),var(--accent)); color:white; border:none; padding:15px; border-radius:25px; font-size:17px; font-weight:bold; width:100%; cursor:pointer; }
.submit-btn:disabled { background:var(--bg-tertiary); color:var(--text-muted); cursor:not-allowed; }
.media-upload { border:2px dashed var(--accent); border-radius:15px; padding:20px; text-align:center; cursor:pointer; background:var(--input-bg); }
.media-preview { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.preview-item { position:relative; width:90px; height:90px; cursor:pointer; }
.preview-item img,.preview-item video { width:100%; height:100%; border-radius:10px; object-fit:cover; border:2px solid var(--accent); transition:transform .2s; }
.remove-media { position:absolute; top:-8px; right:-8px; background:#ef4444; color:white; border-radius:50%; width:22px; height:22px; text-align:center; font-size:13px; cursor:pointer; line-height:22px; z-index:2; }
.zoom-overlay { position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,.7); color:white; border-radius:50%; width:24px; height:24px; text-align:center; font-size:12px; line-height:24px; pointer-events:none; }
.bank-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
.bank-item { background:var(--input-bg); border:2px solid var(--border-color); border-radius:12px; padding:10px; text-align:center; cursor:pointer; font-size:12px; }
.bank-item.selected { border-color:var(--accent); background:rgba(59,130,246,.2); }
.bank-logo { font-size:22px; display:block; margin-bottom:4px; }
.bank-name { font-size:10px; color:var(--text-secondary); }
.account-box { background:linear-gradient(135deg,rgba(30,64,175,.2),rgba(59,130,246,.2)); border:2px solid var(--accent); border-radius:15px; padding:18px; margin:12px 0; text-align:center; position:relative; }
.account-box-title { color:var(--accent); font-size:13px; font-weight:bold; margin-bottom:8px; }
.account-number { color:var(--text-primary); font-size:20px; font-weight:bold; letter-spacing:2px; margin:8px 0; }
.account-holder { color:var(--text-secondary); font-size:12px; }
.copy-btn { position:absolute; top:12px; right:12px; background:var(--accent-dark); color:white; border:none; padding:6px 12px; border-radius:15px; font-size:11px; font-weight:bold; cursor:pointer; }
.copy-btn.copied { background:#10b981; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.9); z-index:300; justify-content:center; align-items:center; padding:15px; }
.modal.show { display:flex; }
.modal-content { background:var(--bg-secondary); padding:25px; border-radius:20px; max-width:450px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid var(--accent-dark); }
.fullscreen-viewer { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#000; z-index:500; justify-content:center; align-items:center; flex-direction:column; }
.fullscreen-viewer.show { display:flex; }
.fullscreen-viewer img { max-width:98%; max-height:80vh; object-fit:contain; transition:transform .3s; }
.fullscreen-viewer video { max-width:98%; max-height:80vh; }
.close-fullscreen { position:absolute; top:15px; right:20px; color:white; font-size:40px; cursor:pointer; z-index:501; background:rgba(0,0,0,.5); width:45px; height:45px; border-radius:50%; text-align:center; line-height:45px; }
.viewer-controls { position:absolute; bottom:20px; display:flex; gap:10px; z-index:501; flex-wrap:wrap; justify-content:center; }
.viewer-controls button { background:rgba(30,64,175,.8); color:white; border:none; padding:10px 18px; border-radius:25px; font-weight:bold; cursor:pointer; font-size:14px; }
.viewer-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.5); color:white; font-size:30px; cursor:pointer; width:45px; height:45px; border-radius:50%; text-align:center; line-height:45px; z-index:501; }
.viewer-nav.prev { left:15px; }
.viewer-nav.next { right:15px; }
.viewer-info { position:absolute; top:15px; left:20px; color:white; background:rgba(0,0,0,.6); padding:8px 15px; border-radius:20px; font-size:13px; z-index:501; }
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--accent-dark); color:white; padding:12px 25px; border-radius:25px; font-size:14px; z-index:400; max-width:90%; text-align:center; animation:slideUp .3s; }
@keyframes slideUp { from { bottom:60px; opacity:0; } to { bottom:80px; opacity:1; } }
.toast.success { background:#10b981; }
.toast.error { background:#ef4444; }
.toast.warn { background:#f59e0b; }
.empty { text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty-icon { font-size:60px; margin-bottom:15px; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--bg-primary); display:flex; justify-content:space-around; padding:10px 3px; border-top:2px solid var(--accent-dark); z-index:100; }
.nav-item { text-align:center; cursor:pointer; padding:5px 6px; color:var(--text-muted); flex:1; }
.nav-item.active { color:var(--accent); }
.nav-icon { font-size:20px; display:block; }
.nav-label { font-size:9px; margin-top:2px; }
.featured-badge { position:absolute; top:-8px; right:12px; background:linear-gradient(135deg,#f59e0b,#eab308); color:#1a1a1a; padding:3px 10px; border-radius:12px; font-size:10px; font-weight:bold; }
.edit-badge { background:#8b5cf6; color:white; padding:3px 10px; border-radius:12px; font-size:10px; font-weight:bold; cursor:pointer; }
.edit-badge.expired { background:#52525b; cursor:not-allowed; }
.ad-lifetime-badge { position:absolute; top:-8px; left:12px; background:linear-gradient(135deg,#10b981,#059669); color:white; padding:3px 10px; border-radius:12px; font-size:10px; font-weight:bold; display:flex; align-items:center; gap:4px; }
.ad-lifetime-badge.warn { background:linear-gradient(135deg,#f59e0b,#d97706); }
.ad-lifetime-badge.danger { background:linear-gradient(135deg,#ef4444,#dc2626); }
.ad-lifetime-badge.expired { background:linear-gradient(135deg,#52525b,#3f3f46); }
.payment-bar { background:var(--bg-primary); border-radius:15px; padding:15px; margin:12px 15px; border:2px solid var(--border-color); }
.payment-bar.active { border-color:#10b981; background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(5,150,105,.15)); }
.payment-bar.expiring { border-color:#f59e0b; background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(217,119,6,.15)); }
.payment-bar.expired { border-color:#ef4444; background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(220,38,38,.15)); }
.payment-bar-title { font-weight:bold; font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.payment-bar-title.active { color:#10b981; }
.payment-bar-title.expiring { color:#f59e0b; }
.payment-bar-title.expired { color:#ef4444; }
.payment-bar-time { font-size:20px; font-weight:bold; color:var(--text-primary); letter-spacing:2px; font-family:monospace; }
.payment-bar-desc { color:var(--text-secondary); font-size:12px; margin-top:5px; }
.payment-bar-badge { background:#10b981; color:white; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold; }
.payment-bar-badge.warn { background:#f59e0b; }
.payment-bar-badge.danger { background:#ef4444; }
.verify-step { background:var(--bg-primary); border-radius:12px; padding:15px; margin-bottom:10px; border-left:4px solid var(--accent); }
.verify-step-title { color:var(--accent); font-weight:bold; font-size:14px; margin-bottom:5px; }
.verify-step-text { color:var(--text-secondary); font-size:12px; line-height:1.6; }
.info-box { background:rgba(30,58,138,.2); border:2px solid var(--accent); border-radius:12px; padding:12px; margin:10px 0; color:var(--accent); font-size:12px; line-height:1.6; }
.edit-timer-box { background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(99,102,241,.15)); border:2px solid #8b5cf6; border-radius:15px; padding:15px; margin:12px 0; }
.edit-timer-title { color:#8b5cf6; font-weight:bold; font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.edit-timer-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-input); }
.edit-timer-row:last-child { border-bottom:none; }
.edit-timer-label { color:var(--text-secondary); font-size:12px; }
.edit-timer-value { color:var(--text-primary); font-weight:bold; font-size:14px; font-family:monospace; }
.edit-timer-value.warn { color:#f59e0b; }
.edit-timer-value.danger { color:#ef4444; }
.edit-timer-progress { height:8px; background:var(--bg-tertiary); border-radius:4px; margin-top:10px; overflow:hidden; }
.edit-timer-progress-bar { height:100%; background:linear-gradient(90deg,#8b5cf6,#6366f1); border-radius:4px; transition:width .3s; }
.edit-timer-progress-bar.warn { background:linear-gradient(90deg,#f59e0b,#d97706); }
.edit-timer-progress-bar.danger { background:linear-gradient(90deg,#ef4444,#dc2626); }
.star-rating { display:flex; gap:5px; font-size:28px; cursor:pointer; justify-content:center; margin:10px 0; }
.star-rating .star { color:#52525b; transition:transform .2s; }
.star-rating .star.filled { color:#ffc107; }
.star-rating .star:active { transform:scale(1.3); }
.comment-section { background:var(--bg-secondary); border-radius:15px; padding:15px; margin:12px 15px; border:1px solid var(--border-color); }
.comment-title { color:var(--accent); font-weight:bold; font-size:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.comment-item { background:var(--bg-primary); border-radius:10px; padding:12px; margin-bottom:10px; border-left:3px solid var(--accent); }
.comment-header { display:flex; justify-content:space-between; margin-bottom:6px; }
.comment-name { font-weight:bold; color:var(--accent); font-size:13px; }
.comment-date { color:var(--text-muted); font-size:11px; }
.comment-text { color:var(--text-primary); font-size:13px; line-height:1.5; opacity:.9; }
.comment-stars { color:#ffc107; font-size:12px; margin-bottom:4px; }
.comment-input-box { display:flex; gap:8px; margin-top:10px; }
.comment-input-box input { flex:1; padding:10px; border:1px solid var(--border-input); border-radius:20px; background:var(--input-bg); color:var(--text-primary); font-size:13px; }
.comment-input-box button { padding:10px 18px; background:var(--accent-dark); color:white; border:none; border-radius:20px; font-weight:bold; cursor:pointer; font-size:13px; }
.admin-panel { background:var(--bg-secondary); border-radius:20px; padding:20px; margin:15px; border:2px solid #ef4444; }
.admin-title { color:#ef4444; font-weight:bold; font-size:18px; margin-bottom:15px; display:flex; align-items:center; gap:10px; }
.admin-stat { background:var(--bg-primary); border-radius:12px; padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid var(--accent); }
.admin-stat-label { color:var(--text-secondary); font-size:13px; }
.admin-stat-value { color:var(--text-primary); font-weight:bold; font-size:20px; }
.admin-item { background:var(--bg-primary); border-radius:10px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.admin-item-info { flex:1; }
.admin-item-name { color:var(--accent); font-weight:bold; font-size:13px; }
.admin-item-detail { color:var(--text-muted); font-size:11px; margin-top:3px; }
.admin-item-actions { display:flex; gap:5px; }
.admin-item-actions button { padding:6px 10px; border:none; border-radius:15px; font-size:11px; font-weight:bold; cursor:pointer; }
.login-box { background:var(--bg-secondary); border-radius:20px; padding:25px; margin:15px; border:2px solid var(--accent); }
.login-icon { text-align:center; font-size:60px; margin-bottom:15px; }
.login-title { color:var(--accent); font-weight:bold; font-size:20px; text-align:center; margin-bottom:20px; }
.share-btn { background:linear-gradient(135deg,#10b981,#059669); color:white; border:none; padding:10px; border-radius:25px; font-weight:bold; cursor:pointer; font-size:12px; flex:1; }
.map-container { background:var(--bg-secondary); border-radius:15px; padding:15px; margin:12px 15px; border:1px solid var(--border-color); }
.map-title { color:var(--accent); font-weight:bold; font-size:14px; margin-bottom:10px; }
.map-placeholder { background:linear-gradient(135deg,rgba(30,64,175,.2),rgba(59,130,246,.2)); border:2px dashed var(--accent); border-radius:12px; padding:30px; text-align:center; color:var(--text-secondary); font-size:12px; }
.notif-badge { position:absolute; top:-5px; right:-5px; background:#ef4444; color:white; border-radius:50%; width:18px; height:18px; font-size:10px; font-weight:bold; display:flex; align-items:center; justify-content:center; }
.notif-wrapper { position:relative; display:inline-block; }
.notif-item { background:var(--bg-primary); border-radius:10px; padding:12px; margin-bottom:8px; border-left:3px solid var(--accent); }
.notif-title { color:var(--accent); font-weight:bold; font-size:13px; }
.notif-text { color:var(--text-secondary); font-size:12px; margin-top:3px; }
.notif-time { color:var(--text-muted); font-size:10px; margin-top:3px; }
.pin-input-box { text-align:center; padding:20px; }
.pin-icon { font-size:60px; margin-bottom:15px; }
.pin-title { color:#ef4444; font-weight:bold; font-size:18px; margin-bottom:10px; }
.pin-subtitle { color:var(--text-secondary); font-size:13px; margin-bottom:20px; }
.pin-input { text-align:center; letter-spacing:15px; font-size:24px; padding:15px; border:2px solid var(--accent); border-radius:12px; background:var(--input-bg); color:var(--text-primary); width:100%; font-family:monospace; font-weight:bold; }
.pin-input:focus { outline:none; border-color:#ef4444; }
.pin-hint { color:var(--text-muted); font-size:11px; margin-top:10px; }
@media (max-width:480px) { .categories-grid { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>

<div class="header">
    <div class="header-icons">
        <div class="header-icon notif-wrapper" onclick="showNotifications()">
            🔔
            <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </div>
        <div class="header-icon" onclick="toggleTheme()" id="themeIcon">🌙</div>
        <div class="header-icon" onclick="showTab('settings')">⚙️</div>
    </div>
    <div class="logo">💍 WEDDING Market</div>
    <div class="tagline" id="tagline">ሁሉም የሰርግ አገልግሎቶች በአንድ ቦታ</div>
</div>

<div class="lang-switch">
    <button class="lang-btn active" id="langAm" onclick="setLang('am')">🇪🇹 አማርኛ</button>
    <button class="lang-btn" id="langEn" onclick="setLang('en')">🇬🇧 English</button>
</div>

<div class="tabs">
    <div class="tab active" onclick="showTab('home')" id="tabHome">🏠 መነሻ</div>
    <div class="tab" onclick="showTab('services')" id="tabServices">📋 አገልግሎቶች</div>

function t(key) { return T[currentLang][key] || key; }
function getCatName(cat) {
    if (!cat) return '';
    const c = CATEGORIES.find(x => x.name_am === cat || x.name_en === cat);
    if (c) return currentLang === 'am' ? c.name_am : c.name_en;
    return cat;
}
function getBankName(bank) {
    if (!bank) return '';
    const b = BANKS.find(x => x.name_am === bank || x.name_en === bank || x.id === bank);
    if (b) return currentLang === 'am' ? b.name_am : b.name_en;
    return bank;
}
function getEditInfo(serviceId) {
    const s = services.find(x => x.id === serviceId);
    if (!s || !s.date) return null;
    const postedDate = new Date(s.date).getTime();
    const deadline = postedDate + (EDIT_VALIDITY_DAYS * 24 * 60 * 60 * 1000);
    const now = Date.now();
    const totalDuration = EDIT_VALIDITY_DAYS * 24 * 60 * 60 * 1000;
    const elapsed = now - postedDate;
    const remaining = deadline - now;
    const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
    const daysLeft = Math.floor(remaining / (1000 * 60 * 60 * 24));
    const hoursLeft = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutesLeft = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
    return {
        postedDate, deadline, remaining, progressPercent,
        daysLeft: Math.max(0, daysLeft), hoursLeft: Math.max(0, hoursLeft),
        minutesLeft: Math.max(0, minutesLeft),
        isExpired: remaining <= 0,
        isExpiring: remaining > 0 && remaining < (2 * 24 * 60 * 60 * 1000)
    };
}
function getAdLifetimeInfo(serviceId) {
    const s = services.find(x => x.id === serviceId);
    if (!s || !s.date) return null;
    const postedDate = new Date(s.date).getTime();
    const expiryDate = postedDate + (AD_LIFETIME_DAYS * 24 * 60 * 60 * 1000);
    const now = Date.now();
    const totalDuration = AD_LIFETIME_DAYS * 24 * 60 * 60 * 1000;
    const elapsed = now - postedDate;
    const remaining = expiryDate - now;
    const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
    const daysLeft = Math.ceil(remaining / (1000 * 60 * 60 * 24));
    return {
        postedDate, expiryDate, remaining, progressPercent,
        daysLeft: Math.max(0, daysLeft),
        isExpired: remaining <= 0,
        isExpiring: remaining > 0 && remaining < (5 * 24 * 60 * 60 * 1000)
    };
}
function getActiveServices() {
    return services.filter(s => {
        const info = getAdLifetimeInfo(s.id);
        return info && !info.isExpired;
    });
}
function formatDate(ts) {
    const d = new Date(ts);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    return `${day}/${month}/${year} ${hours}:${minutes}`;
}

function adLifetimeBadgeHTML(serviceId) {
    const info = getAdLifetimeInfo(serviceId);
    if (!info) return '';
    let badgeClass = '', icon = '📅';
    if (info.isExpired) { badgeClass = 'expired'; icon = '❌'; }
    else if (info.isExpiring) { badgeClass = 'danger'; icon = '⚠️'; }
    else if (info.daysLeft <= 10) { badgeClass = 'warn'; icon = '⏰'; }
    return `<div class="ad-lifetime-badge ${badgeClass}">${icon} ${info.isExpired ? t('adExpired') : info.daysLeft + ' ' + t('editDays')}</div>`;
}

    if (!paymentStatus.verified) return false;

    return Math.max(0, paymentStatus.expiresAt - Date.now());

function formatTime(ms) {
    if (ms <= 0) return '00:00:00';
    const hours = Math.floor(ms / (1000*60*60));
    const minutes = Math.floor((ms % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((ms % (1000*60)) / 1000);
    return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

    if (countdownInterval) clearInterval(countdownInterval);

let selectedStarRating = 0;
function selectRating(n) {
    selectedStarRating = n;
    document.querySelectorAll('#starRating .star').forEach((el, i) => el.classList.toggle('filled', i < n));
    document.getElementById('ratingText').textContent = `${t('yourRating')}: ${n}/5`;
}
function submitRating(serviceId) {
    if (selectedStarRating === 0) { toast('⚠️ ደረጃ ይምረጡ!', 'error'); return; }
    const userId = currentUser?.phone || 'guest';
    const existing = ratings.findIndex(r => r.serviceId === serviceId && r.userId === userId);
    const ratingData = { serviceId, userId, stars: selectedStarRating, date: new Date().toISOString(), name: currentUser?.name || t('guest') };
    if (existing > -1) ratings[existing] = ratingData;
    else ratings.push(ratingData);
    const s = services.find(x => x.id === serviceId);
    if (s) {
        const serviceRatings = ratings.filter(r => r.serviceId === serviceId);
        const avg = serviceRatings.reduce((a, b) => a + b.stars, 0) / serviceRatings.length;
        s.rating = Math.round(avg * 10) / 10;
        s.reviews = serviceRatings.length;
    }
    addNotification('rating', t('newRating'), `${s.name} - ${selectedStarRating}⭐`);
    saveData();
    selectedStarRating = 0;
    toast(t('ratingSubmitted'), 'success');
    renderDetail();
    renderAllServices();
}
function addComment(serviceId) {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const s = services.find(x => x.id === serviceId);
    comments.push({ serviceId, name: currentUser?.name || t('guest'), text, date: new Date().toISOString(), stars: selectedStarRating || 0 });
    addNotification('comment', t('newComment'), `${s.name}: ${text.substring(0, 40)}...`);
    saveData();
    input.value = '';
    toast(t('commentAdded'), 'success');
    renderDetail();
}
function shareAd(id) {
    const s = services.find(x => x.id === id);
    if (!s) return;
    const text = `💍 ${s.name}\n📋 ${getCatName(s.category)}\n💰 ${s.price}\n📍 ${s.city}\n📞 ${s.phone}\n\n${s.description}`;
    const url = window.location.href;
    if (navigator.share) navigator.share({ title: s.name, text, url }).catch(() => {});
    else { copyToClipboard(text + '\n' + url); toast(t('copied'), 'success'); }
}
function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
    else fallbackCopyText(text);
}
function fallbackCopyText(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
}

// ==================== NAVIGATION ====================
function goBack() {
    if (navHistory.length > 0) { const prev = navHistory.pop(); showTab(prev, true); }
    else showTab('home', true);
}
function showTab(tab, skipHistory) {
    if (!skipHistory && tab !== currentTab && tab !== 'detail' && tab !== 'admin') {
        navHistory.push(currentTab);
        if (navHistory.length > 20) navHistory.shift();
    }
    currentTab = tab;
    const tabs = ['home','services','detail','post','myads','saved','settings','admin'];
    tabs.forEach(t => {
        const el = document.getElementById(t + 'Tab');
        if (el) el.style.display = t === tab ? 'block' : 'none';
    });
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const map = { home:0, services:1, post:2, myads:3, saved:4, settings:5 };
    const idx = map[tab];
    if (idx !== undefined) {
        document.querySelectorAll('.tab')[idx].classList.add('active');
        document.querySelectorAll('.nav-item')[idx].classList.add('active');
    }
    if (tab === 'home') { renderPaymentStatus(); renderCategories(); }
    if (tab === 'saved') renderSaved();
    if (tab === 'services') {
        if (!viewingCategory) renderAllServices();
        else renderViewingCategoryServices();
    }
    if (tab === 'detail') renderDetail();
    if (tab === 'post') renderPostTab();
    if (tab === 'myads') renderMyAds();
    if (tab === 'settings') loadSettingsUI();
    if (tab === 'admin') renderAdminPanel();
}

function serviceCardHTML(s) {
    const isSaved = savedServices.includes(s.id);
    const stars = '⭐'.repeat(Math.floor(s.rating)) + '☆'.repeat(5 - Math.floor(s.rating));
    const isMine = myAds.includes(s.id);
    const mediaItems = s.media || [];
    const catName = getCatName(s.category);
    const featuredText = currentLang === 'am' ? '⭐ ቅድሚያ' : '⭐ Premium';
    const editInfo = getEditInfo(s.id);
    const canEdit = editInfo && !editInfo.isExpired;
    const lifetimeInfo = getAdLifetimeInfo(s.id);
    let editBtnHtml = '';
    if (isMine) {
        if (canEdit) {
            const daysText = editInfo.daysLeft > 0 ? `${editInfo.daysLeft} ${t('editDays')}` : `${editInfo.hoursLeft} ${t('editHours')}`;
            editBtnHtml = `<button class="edit-badge" onclick="event.stopPropagation();editAd(${s.id})">✏️ ${currentLang === 'am' ? 'አስተካክል' : 'Edit'} (${daysText})</button>`;
        } else {
            editBtnHtml = `<button class="edit-badge expired" disabled>${t('editTimeExpired')}</button>`;
        }
    }
    return `
        <div class="service-card" onclick="showDetail(${s.id})" style="cursor:pointer;">
            ${s.featured ? `<div class="featured-badge">${featuredText}</div>` : ''}
            ${lifetimeInfo ? adLifetimeBadgeHTML(s.id) : ''}
            <div class="service-header">

                <div class="service-price">${s.price}</div>
            </div>
            <div class="service-details" style="margin-bottom:10px;"><span>📋 ${catName}</span></div>
            ${mediaItems.length > 0 ? `
                <div class="media-preview" style="margin-bottom:10px;">
                    ${mediaItems.map((m, i) => `
                        <div class="preview-item" onclick="event.stopPropagation();openViewer(${s.id}, ${i})">
                            ${m.type === 'image' ? `<img src="${m.url}">` : `<video src="${m.url}"></video>`}
                            <div class="zoom-overlay">🔍</div>
                        </div>
                    `).join('')}

function toggleSave(id) {

function updateAdCategoryDropdown() {
    const sel = document.getElementById('adCategory');
    if (!sel) return;

function handleMedia(e) {
    const files = Array.from(e.target.files);
    if (selectedMedia.length + files.length > 10) { toast(t('tooManyPhotos'), 'error'); return; }
    files.forEach(f => {
        const r = new FileReader();
        r.onload = ev => { selectedMedia.push({ type:'image', url:ev.target.result }); renderMediaPreview(); };
        r.readAsDataURL(f);
    });
    e.target.value = '';
}
function renderMediaPreview() {
    const el = document.getElementById('mediaPreview');
    if (!el) return;
    el.innerHTML = selectedMedia.map((m,i) => `
        <div class="preview-item" onclick="viewMedia('${m.url}','image')">
            <img src="${m.url}">
            <div class="remove-media" onclick="event.stopPropagation();selectedMedia.splice(${i},1);renderMediaPreview();">×</div>
            <div class="zoom-overlay">🔍</div>
        </div>
    `).join('');
}
function handleVideo(e) {
    const file = e.target.files[0];
    if (!file) return;
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.onloadedmetadata = () => {
        window.URL.revokeObjectURL(video.src);
        if (video.duration > 120) { document.getElementById('videoWarn').style.display = 'block'; toast(t('videoTooLong'), 'error'); return; }
        document.getElementById('videoWarn').style.display = 'none';
        const r = new FileReader();
        r.onload = ev => { selectedVideo = { type:'video', url:ev.target.result, duration:video.duration }; renderVideoPreview(); toast(t('videoUploaded') + ' (' + Math.round(video.duration) + 's)', 'success'); };
        r.readAsDataURL(file);
    };
    video.src = URL.createObjectURL(file);
    e.target.value = '';
}
function renderVideoPreview() {
    const c = document.getElementById('videoPreview');
    if (!c) return;
    if (!selectedVideo) { c.innerHTML = ''; return; }
    c.innerHTML = `
        <div class="preview-item" onclick="viewMedia('${selectedVideo.url}','video')">
            <video src="${selectedVideo.url}"></video>
            <div class="remove-media" onclick="event.stopPropagation();selectedVideo=null;renderVideoPreview();">×</div>
            <div class="zoom-overlay">🔍</div>
        </div>
    `;
}

function submitAd() {
    const isEditing = currentEditingId !== null;
    if (isEditing) {
        const info = getEditInfo(currentEditingId);
        if (!info || info.isExpired) { toast(t('editExpired'), 'error'); currentEditingId = null; showTab('myads'); return; }
    } else {
        if (!isPaymentValid()) { toast(t('paymentExpired'), 'error'); renderPostTab(); return; }
    }
    const name = document.getElementById('adName').value.trim();
    const category = document.getElementById('adCategory').value;
    const phone = document.getElementById('adPhone').value.trim();
    const city = document.getElementById('adCity').value.trim() || (currentLang === 'am' ? 'አዲስ አበባ' : 'Addis Ababa');
    const price = document.getElementById('adPrice').value.trim() || (currentLang === 'am' ? 'ይደውሉ' : 'Call');
    const desc = document.getElementById('adDesc').value.trim() || (currentLang === 'am' ? 'አዲስ አገልግሎት' : 'New service');
    if (!name || !phone) { toast(t('fillNamePhone'), 'error'); return; }
    const allMedia = [...selectedMedia];
    if (selectedVideo) allMedia.push(selectedVideo);
    if (isEditing) {
        const s = services.find(x => x.id === currentEditingId);
        if (s) {
            s.category = category; s.name = name; s.phone = phone; s.city = city;
            s.price = price; s.description = desc; s.media = allMedia;
            s.updatedAt = new Date().toISOString();
            toast(t('adUpdated'), 'success');
        }
        saveData();
        currentEditingId = null;
        renderCategories();
        if (viewingCategory) renderViewingCategoryServices();
        else renderAllServices();
        renderMyAds();
        showTab('myads');
    } else {
        const newId = services.length > 0 ? Math.max(...services.map(s => s.id)) + 1 : 1;
        services.push({
            id: newId, category, name, phone, city, price, description: desc,
            rating: 5.0, reviews: 0,
            featured: paymentStatus.type === 'premium',
            media: allMedia, date: new Date().toISOString()
        });
        myAds.push(newId);
        paymentStatus.used = true;
        paymentStatus.postedAdId = newId;
        paymentStatus.verified = false;
        paymentStatus.expiresAt = Date.now();
        addNotification('ad', t('newAdPosted'), name);
        toast(t('adSubmitted'), 'success');
        saveData();
        resetForm();
        renderCategories();
        if (viewingCategory) renderViewingCategoryServices();
        else renderAllServices();
        renderMyAds();
        renderPaymentStatus();
        showTab('myads');
    }
}

// ==================== VIEWER ====================
function openViewer(serviceId, index) {
    const s = services.find(x => x.id === serviceId);
    if (!s || !s.media) return;
    viewerMedia = s.media; viewerIndex = index;
    renderViewer();
    document.getElementById('fullscreenViewer').classList.add('show');
}
function viewMedia(url, type) {
    viewerMedia = [{ type, url }]; viewerIndex = 0;
    renderViewer();
    document.getElementById('fullscreenViewer').classList.add('show');
}
function renderViewer() {
    const m = viewerMedia[viewerIndex];
    if (!m) return;
    const content = document.getElementById('viewerContent');
    content.innerHTML = m.type === 'image' ? `<img src="${m.url}" id="viewerImg" style="transform:scale(1)">` : `<video src="${m.url}" controls autoplay id="viewerVid"></video>`;
    document.getElementById('viewerInfo').textContent = `${viewerIndex + 1}/${viewerMedia.length}`;
    const controls = document.getElementById('viewerControls');
    const html = [];
    if (m.type === 'image') {
        html.push(`<button onclick="zoomImage(1.5)">${t('zoom')}</button>`);
        html.push(`<button onclick="zoomImage(0.7)">${t('zoomOut')}</button>`);
        html.push(`<button onclick="resetZoom()">${t('reset')}</button>`);
    } else {
        html.push(`<button onclick="togglePlay()">${t('play')}</button>`);
        html.push(`<button onclick="toggleMute()">${t('mute')}</button>`);
    }
    html.push(`<button onclick="closeViewer()">${t('close')}</button>`);
    controls.innerHTML = html.join('');
    document.querySelector('.viewer-nav.prev').style.display = viewerMedia.length > 1 ? 'block' : 'none';
    document.querySelector('.viewer-nav.next').style.display = viewerMedia.length > 1 ? 'block' : 'none';
}
function zoomImage(f) {
    const img = document.getElementById('viewerImg');
    if (!img) return;
    const cur = parseFloat(img.dataset.scale || '1');
    const ns = Math.max(0.5, Math.min(5, cur * f));
    img.dataset.scale = ns;
    img.style.transform = `scale(${ns})`;
    toast(`Zoom: ${Math.round(ns * 100)}%`);
}
function resetZoom() { const img = document.getElementById('viewerImg'); if (img) { img.dataset.scale = '1'; img.style.transform = 'scale(1)'; } }
function togglePlay() { const v = document.getElementById('viewerVid'); if (v) v.paused ? v.play() : v.pause(); }
function toggleMute() { const v = document.getElementById('viewerVid'); if (v) { v.muted = !v.muted; toast(v.muted ? '🔇' : '🔊'); } }
function nextMedia() { if (viewerIndex < viewerMedia.length - 1) { viewerIndex++; renderViewer(); } }
function prevMedia() { if (viewerIndex > 0) { viewerIndex--; renderViewer(); } }
function closeViewer() { document.getElementById('fullscreenViewer').classList.remove('show'); document.getElementById('viewerContent').innerHTML = ''; }

// ==================== COPY ====================
function copyAccount(account, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(account).then(() => {
            btn.classList.add('copied'); btn.innerHTML = t('copied');
            toast('📋 ' + account, 'success');
            setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = t('copy'); }, 2000);
        }).catch(() => fallbackCopy(account, btn));
    } else { fallbackCopy(account, btn); }
}
function fallbackCopy(text, btn) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try {
        document.execCommand('copy');
        btn.classList.add('copied'); btn.innerHTML = t('copied');
        toast('📋 ' + text, 'success');
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = t('copy'); }, 2000);
    } catch (e) { toast('⚠️ Copy failed', 'error'); }
    document.body.removeChild(ta);
}

// ==================== UTILS ====================
function toast(msg, type) {
    const tt = document.createElement('div');
    tt.className = 'toast' + (type === 'success' ? ' success' : type === 'error' ? ' error' : type === 'warn' ? ' warn' : '');
    tt.textContent = msg;
    document.body.appendChild(tt);
    setTimeout(() => tt.remove(), 3500);
}
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeViewer(); closeModal(); }
    if (e.key === 'ArrowRight') nextMedia();
    if (e.key === 'ArrowLeft') prevMedia();
});

loadData();
setLang('am');
renderPaymentStatus();
